<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzyFestFantasyFootball | Playoff Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
</head>

<body class="light-theme">
    <div id="app">
        <!-- Header with Logo & Breadcrumbs -->
        <header class="main-header">
            <div class="logo-text">
                <span class="black">FizzyFest</span><span class="red">FantasyFootball</span>
            </div>
            <nav id="breadcrumb-nav" class="breadcrumbs"></nav>
        </header>

        <main id="main-content">
            <!-- Login View -->
            <section id="login-view" class="container text-center">
                <h2 style="margin-bottom: 2rem; font-weight: 800; letter-spacing: -1px;">WELCOME</h2>
                <div class="card glass max-w-sm mx-auto">
                    <div class="form-group text-left">
                        <label>ENTER YOUR NAME</label>
                        <input type="text" id="login-username" placeholder="Name" autocomplete="off">
                    </div>
                    <button id="login-btn" class="btn primary w-full">Sign In</button>

                    <div id="debug-panel" class="mt-8 pt-4" style="border-top: 1px solid var(--border);">
                        <details>
                            <summary style="font-size: 0.7rem; color: var(--gray); cursor: pointer; font-weight: 800;">
                                SYSTEM STATUS</summary>
                            <div id="system-debug-content" class="debug-content text-left">
                                <!-- Injected via JS -->
                            </div>
                            <button id="emergency-reset-btn" class="btn text-link"
                                style="color: var(--red); font-size: 0.6rem; margin-top: 10px;">Burn Everything &
                                Reset</button>
                        </details>
                    </div>
                </div>
            </section>

            <!-- Dashboard View -->
            <section id="dashboard-view" class="container hidden">
                <div class="league-grid" id="leagues-grid">
                    <!-- Leagues injected here -->
                </div>
                <div class="actions-footer mt-8 d-flex flex-column items-center gap-4">
                    <button id="show-create-league-btn" class="btn outline-pill">+ Add New League</button>

                    <div class="sync-box mt-4 p-4 glass w-full max-w-sm"
                        style="border-radius: 12px; border: 1px solid var(--border);">
                        <p style="font-size: 0.6rem; font-weight: 800; margin-bottom: 8px;">JOIN EXISTING LEAGUE</p>
                        <div class="d-flex gap-2">
                            <input type="text" id="sync-input" placeholder="e.g. FF-123456"
                                style="font-size: 0.8rem; flex: 1;">
                            <button onclick="handleJoinCode()" class="btn primary py-2 px-4"
                                style="font-size: 0.7rem;">JOIN</button>
                        </div>
                    </div>

                    <button id="logout-btn" class="btn text-link">Logout</button>
                </div>
            </section>

            <!-- New League View -->
            <section id="new-league-view" class="container hidden">
                <h2 style="margin-bottom: 1rem;">New League</h2>
                <div class="card glass max-w-sm mx-auto">
                    <div class="form-group">
                        <label>LEAGUE NAME</label>
                        <input type="text" id="league-name" placeholder="Enter name">
                    </div>
                    <div class="d-flex justify-end mt-4">
                        <button id="save-league-btn" class="btn primary">Save League</button>
                    </div>
                </div>
            </section>

            <!-- League Detail View -->
            <section id="league-detail-view" class="container hidden">
                <div id="league-banner-container"></div>
                <div class="stats-table" id="league-stats-table">
                    <!-- Team | Score | Players Remaining Table -->
                </div>

                <div class="actions-footer flex-center gap-4 mt-12">
                    <button id="start-draft-btn" class="btn primary">Start Draft</button>
                    <button id="show-settings-btn" class="btn outline-pill">Settings</button>
                    <button id="add-team-btn" class="btn outline-pill">+ Team</button>
                    <button id="save-state-btn" class="btn primary">Save Changes</button>
                </div>
            </section>

            <!-- Settings View -->
            <section id="settings-view" class="container hidden">
                <div class="card glass max-w-lg mx-auto">
                    <h2 class="section-title mb-6">SCORING SETTINGS</h2>
                    <div id="scoring-settings-list" class="space-y-4"
                        style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <!-- Generated by JS -->
                    </div>
                    <div class="d-flex justify-between mt-12 pt-6" style="border-top: 1px solid var(--border);">
                        <button id="settings-back-btn" class="btn outline-pill">Back</button>
                        <div id="settings-admin-actions" class="hidden">
                            <button id="save-settings-btn" class="btn primary">Save Settings</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Draft Board View -->
            <section id="draft-view" class="container hidden">
                <!-- Navigation Tabs -->
                <div class="draft-tabs-nav mb-6 d-flex justify-center gap-4">
                    <button class="tab-btn active" data-draft-tab="board">Draft Board</button>
                    <button class="tab-btn" data-draft-tab="roster">My Roster</button>
                    <button class="tab-btn" data-draft-tab="feed">Draft Feed</button>
                </div>

                <!-- Tab Content: Board -->
                <div id="tab-content-board" class="tab-content">
                    <div class="draft-header-info">
                        <div class="search-container">
                            <input type="text" id="player-search" placeholder="Search player..." class="w-full">
                        </div>
                        <div class="live-status-container">
                            <div class="live-indicator"
                                style="width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; transition: background 0.3s;">
                            </div>
                            <div id="draft-status-badge" class="badge-red">Pick 1</div>
                        </div>
                    </div>
                    <div id="filter-bar" class="mb-6"></div>

                    <!-- Stat View Selector -->
                    <div class="stat-tabs-container mb-4 d-flex gap-2" style="padding-bottom:10px;">
                        <button class="stat-tab-btn active" data-stat-tab="fantasyPts">Points</button>
                        <button class="stat-tab-btn" data-stat-tab="passYds">Pass Yds</button>
                        <button class="stat-tab-btn" data-stat-tab="passTD">Pass TDs</button>
                        <button class="stat-tab-btn" data-stat-tab="rushYds">Rush Yds</button>
                        <button class="stat-tab-btn" data-stat-tab="rushTD">Rush TDs</button>
                        <button class="stat-tab-btn" data-stat-tab="recs">Recs</button>
                        <button class="stat-tab-btn" data-stat-tab="recYds">Rec Yds</button>
                        <button class="stat-tab-btn" data-stat-tab="recTD">Rec TDs</button>
                    </div>

                    <div class="player-list-section card glass no-padding">
                        <div id="player-list" class="player-scroll"></div>
                    </div>
                </div>

                <!-- Tab Content: Roster -->
                <div id="tab-content-roster" class="tab-content hidden">
                    <div class="card glass">
                        <h2 class="section-title mb-6">MY ROSTER</h2>
                        <div id="roster-grid-main" class="roster-grid-large" style="overflow-x: auto;"></div>
                    </div>
                </div>

                <!-- Tab Content: Feed -->
                <div id="tab-content-feed" class="tab-content hidden">
                    <div class="card glass">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h3 class="font-bold" style="margin: 0;">DRAFT FEED</h3>
                            <div class="filter-dropdown-container" id="feed-team-filter-dropdown">
                                <div class="dropdown-trigger" onclick="toggleFeedTeamFilter(event)"
                                    style="padding: 8px 16px; cursor: pointer;">
                                    <div style="display:flex; flex-direction:column;">
                                        <span
                                            style="font-size:0.55rem; color:var(--gray); text-transform:uppercase;">FILTER</span>
                                        <span id="feed-filter-display">All Teams</span>
                                    </div>
                                </div>
                                <div id="feed-team-filter-menu" class="dropdown-menu hidden"
                                    onclick="event.stopPropagation()">
                                    <!-- Populated by JS -->
                                </div>
                            </div>
                        </div>
                        <div id="unified-draft-feed" class="unified-feed-list"
                            style="max-height: 600px; overflow-y: auto; padding-right: 8px;">
                            <!-- Unified feed items injected here -->
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer class="app-footer">
            <span id="app-version">v5.3.3</span>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js" type="module"></script>
</body>

</html>
